---
name: EMBARGOED
description: >
  Embargoed vulnerability workflow. Applies to flaws with embargo ACLs.
  The flaw must be unembargoed (made public) to reach DONE, at which
  point it falls off this workflow for final classification.
priority: 2
conditions:
  - is embargoed
states:
  - name: NEW
    description: >
      A new embargoed flaw arrived into the queue.
    jira_state: New
    jira_resolution: null
    requirements: []

  - name: TRIAGE
    description: >
      The flaw has passed automated initial triage. Basic data has been
      filled in and the flaw is ready for affect creation.
    jira_state: Refinement
    jira_resolution: null
    requirements:
      - has components
      - has CWE
      - has impact
      - has reported_dt
      - has source
      - has title
      - condition: OR
        requirements:
          - impact is low
          - has cve_description

  - name: ANALYSIS
    description: >
      Affects have been created and are being analysed. Each affect
      needs to be resolved before the flaw can proceed.
    jira_state: Refinement
    jira_resolution: null
    requirements:
      - has affects

  - name: PRE_SECONDARY_ASSESSMENT
    description: >
      All affects have been resolved. The trackers can be filed.
    jira_state: To Do
    jira_resolution: null
    requirements:
      - has affects resolved

  - name: SECONDARY_ASSESSMENT
    description: The trackers were filed. The flaw is waiting for the unembargo.
    jira_state: In Progress
    jira_resolution: null
    requirements:
      - has trackers

  - name: DONE
    description: >
      Reaching DONE requires the flaw to no longer be embargoed which makes it
      effectively unreachable (due to conflicting workflow condition). This
      serves as a gating mechanism making sure it eventually falls off this
      workflow and gets finalized the standard way when the embargo is lifted.
    jira_state: Closed
    jira_resolution: Done
    requirements:
      - is not embargoed
